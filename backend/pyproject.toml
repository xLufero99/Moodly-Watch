[project]
name = "moodly-watch-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xLufero99", email = "enanitogomez2011@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "onnxruntime>=1.30.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sentencepiece>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
moodly-watch-backend = "moodly_watch_backend:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# app/ no está instalado en el venv (uv_build solo empaqueta src/), así que
# hay que poner la raíz del backend en el path para poder importar `app`.
pythonpath = ["."]
testpaths = ["tests"]
# `lento` y `requiere_red` sacan los tests que llaman a servicios externos, para que la
# suite normal no dependa de la red ni de tener claves. Se corren a mano:
#     uv run pytest -m lento
addopts = "-m 'not lento'"
markers = [
    "lento: tests lentos, fuera de la suite normal (se corren con -m lento)",
    "requiere_red: necesitan salida a internet o una clave configurada",
]

[dependency-groups]
# pandas, pyarrow y tenacity los usan los scripts (catálogo, índice y descargas) y
# `app/` no importa ninguno de los tres, así que van aquí: en producción se instala
# con --no-dev y la imagen se ahorra ~196 MB.
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "tenacity>=9.1.4",
]
