[project]
name = "moodly-watch-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xLufero99", email = "enanitogomez2011@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
moodly-watch-backend = "moodly_watch_backend:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# app/ no está instalado en el venv (uv_build solo empaqueta src/), así que
# hay que poner la raíz del backend en el path para poder importar `app`.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
